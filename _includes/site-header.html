<header class="site-header">
  <div class="site-frame">
    <a class="site-title" href="{{ '/' | relative_url }}">Daniel Joseph Aronoff</a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {% assign nav_pages = site.pages | where_exp: "item", "item.nav == true" | sort: "nav_order" %}
        {% for item in nav_pages %}
          <li>
            <a href="{{ item.url | relative_url }}" {% if item.url == page.url %}aria-current="page"{% endif %}>
              {{ item.nav_title | default: item.title }}
            </a>
          </li>
        {% endfor %}
        <li>
          <a href="{{ '/#quick-links' | relative_url }}">
            Quick links
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
