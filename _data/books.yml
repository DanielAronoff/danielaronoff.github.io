- title: "ADESS: A Proof-of-Work Protocol to Deter Double-Spend Attacks"
  type: Chapter
  publisher: Springer
  year: 2024
  cover_image_1x: "/assets/img/books/adess-proof-of-work-protocol-chapter-cover-700x1120.jpg"
  cover_image_2x: "/assets/img/books/adess-proof-of-work-protocol-chapter-cover-1400x2240.jpg"
  cover_image: "/assets/img/books/adess-proof-of-work-protocol-chapter-cover-700x1120.jpg"
  cover_image_webp_1x: "/assets/img/books/adess-proof-of-work-protocol-chapter-cover-700x1120.webp"
  cover_image_webp_2x: "/assets/img/books/adess-proof-of-work-protocol-chapter-cover-1400x2240.webp"
  links:
    - label: Springer
      url: https://link.springer.com/chapter/10.1007/978-3-031-53963-3_11
    - label: DOI
      url: https://doi.org/10.1007/978-3-031-53963-3_11
    - label: PDF
      url: /assets/cv/linked/550889_1_En_11_Chapter_Author.pdf
  jacket_text: |
    A principal vulnerability of a proof-of-work (“PoW”)
    blockchain is that an attacker can re-write the history of transactions by
    forking a previously published block and building a new chain segment containing
    a different sequence of transactions. If the attacker’s chain has the most
    cumulative mining puzzle difficulty, nodes will recognize it as canonical.

    We propose a modification to PoW protocols, called ADESS, that contains two novel
    features. The first modification enables a node to identify the attacker chain by
    comparing the temporal sequence of blocks on competing chains. The second
    modification penalizes the attacker by requiring it to apply exponentially increasing
    hashrate in order to make its chain canonical. We demonstrate two things: (i) the
    expected cost of carrying out a double-spend attack is weakly higher under ADESS
    compared to the current PoW protocols and (ii) for any value of transaction, there
    is a penalty setting in ADESS that renders the expected profit of a double-spend
    attack negative.

- title: "The Financial Crisis Reconsidered: The Mercantilist Origin of Secular Stagnation and Boom-Bust Cycles"
  publisher: Springer
  year: 2016
  cover_image: "/assets/img/books/financial-crisis-reconsidered.jpg"
