---
layout: default
---
<section class="page-shell">
  <div class="page-header">
    <p class="section-label">{{ page.nav_title | default: page.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}
      <p class="page-lede">{{ page.lede }}</p>
    {% endif %}
  </div>
  <div class="page-content">
    {{ content }}
  </div>
</section>
